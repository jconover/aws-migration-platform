name: migration-tracker

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migration_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      target: runtime
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/migration_tracker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
