# Seeds the on-premises database with a realistic migration portfolio: the
# inventory a discovery phase would have produced. This is the data that must
# survive the move to AWS intact, and it is what the verification gate in
# docs/RUNBOOK.md checks row counts and checksums against.
apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-seed
  namespace: legacy-onprem
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: legacy-postgres
          env:
            - name: PGHOST
              value: legacy-postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_PASSWORD}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_DB}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done

              # The schema and rows come from deploy/onprem/seed.sql, mounted
              # here as a ConfigMap. The VM source applies the same file, so
              # the two estates cannot drift apart.
              psql -v ON_ERROR_STOP=1 -f /seed/seed.sql

              echo "--- on-premises portfolio ---"
              psql -c "SELECT wave, count(*) AS workloads,
                              count(*) FILTER (WHERE status='validated') AS migrated
                       FROM workloads GROUP BY wave ORDER BY wave;"
              psql -tAc "SELECT 'total rows: ' || count(*) FROM workloads;"
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed-sql
          configMap:
            name: legacy-seed-sql
