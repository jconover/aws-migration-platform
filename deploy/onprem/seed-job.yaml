# Seeds the on-premises database with a realistic migration portfolio: the
# inventory a discovery phase would have produced. This is the data that must
# survive the move to AWS intact, and it is what the verification gate in
# docs/RUNBOOK.md checks row counts and checksums against.
apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-seed
  namespace: legacy-onprem
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: legacy-postgres
          env:
            - name: PGHOST
              value: legacy-postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_PASSWORD}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: legacy-postgres, key: POSTGRES_DB}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done

              psql -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS workloads (
                  id          SERIAL PRIMARY KEY,
                  name        VARCHAR(200) NOT NULL UNIQUE,
                  wave        INTEGER NOT NULL,
                  strategy    VARCHAR(20) NOT NULL,
                  status      VARCHAR(20) NOT NULL DEFAULT 'discovered',
                  owner       VARCHAR(200) NOT NULL,
                  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
                  updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX IF NOT EXISTS ix_workloads_wave   ON workloads (wave);
              CREATE INDEX IF NOT EXISTS ix_workloads_status ON workloads (status);

              -- A portfolio shaped like a real discovery output: a spread of
              -- strategies, a long tail of retire candidates, and waves that
              -- get progressively more critical.
              INSERT INTO workloads (name, wave, strategy, status, owner) VALUES
                ('billing-api',        1, 'replatform', 'validated',  'payments'),
                ('billing-worker',     1, 'replatform', 'validated',  'payments'),
                ('invoice-renderer',   1, 'rehost',     'validated',  'payments'),
                ('legacy-fax-gateway', 1, 'retire',     'assessed',   'facilities'),
                ('print-spooler',      1, 'retire',     'assessed',   'facilities'),
                ('orders-api',         2, 'replatform', 'cutover',    'commerce'),
                ('orders-worker',      2, 'replatform', 'cutover',    'commerce'),
                ('inventory-sync',     2, 'rehost',     'in_flight',  'commerce'),
                ('pricing-engine',     2, 'refactor',   'in_flight',  'commerce'),
                ('warehouse-scanner',  2, 'rehost',     'assessed',   'logistics'),
                ('crm-connector',      3, 'repurchase', 'assessed',   'sales'),
                ('reporting-etl',      3, 'replatform', 'in_flight',  'data'),
                ('data-warehouse',     3, 'relocate',   'discovered', 'data'),
                ('ml-feature-store',   3, 'refactor',   'discovered', 'data'),
                ('hr-portal',          4, 'repurchase', 'discovered', 'people'),
                ('payroll-batch',      4, 'retain',     'assessed',   'people'),
                ('mainframe-bridge',   4, 'retain',     'assessed',   'core-systems'),
                ('auth-service',       4, 'refactor',   'discovered', 'platform'),
                ('audit-log-archive',  5, 'rehost',     'discovered', 'compliance'),
                ('dr-replica',         5, 'relocate',   'discovered', 'platform')
              ON CONFLICT (name) DO NOTHING;
              SQL

              echo "--- on-premises portfolio ---"
              psql -c "SELECT wave, count(*) AS workloads,
                              count(*) FILTER (WHERE status='validated') AS migrated
                       FROM workloads GROUP BY wave ORDER BY wave;"
              psql -tAc "SELECT 'total rows: ' || count(*) FROM workloads;"
