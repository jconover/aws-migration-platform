# Pulls the RDS master credentials from Secrets Manager at pod start via the
# Secrets Store CSI driver. The value never passes through Git, the image, or
# the Terraform state, and rotation is picked up on pod restart.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: migration-tracker-db
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "PLACEHOLDER_DB_SECRET_ARN"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db_username
          - path: password
            objectAlias: db_password
  secretObjects:
    - secretName: migration-tracker-db
      type: Opaque
      data:
        - objectName: db_username
          key: username
        - objectName: db_password
          key: password
