apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-tracker
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENVIRONMENT
              value: prod
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      # Production keeps replicas off the spot burst pool unless they tolerate it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: migration-tracker
