apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: migration-tracker

resources:
  - ../../base

nameSuffix: ""

replicas:
  - name: migration-tracker
    count: 2

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: pdb-patch.yaml

configMapGenerator:
  - name: migration-tracker-config
    behavior: merge
    literals:
      - APP_LOG_LEVEL=DEBUG

# CD substitutes the repository and the digest it just pushed. Using the
# 'digest' field rather than a tag is what makes the deployed artifact
# immutable - kustomize renders it as <repo>@sha256:...
images:
  - name: migration-tracker
    newName: PLACEHOLDER_IMAGE_REPO
    digest: PLACEHOLDER_IMAGE_DIGEST
